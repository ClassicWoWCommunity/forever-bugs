name: Bug Report
description: Report incorrect or unexpected behaviour in WoW Forever
title: "[BUG] "
labels:
  - "Pending Approval"

body:
  - type: markdown
    attributes:
      value: |
        # WoW Forever Bug Report

        Please provide as much detail as possible. The more information you provide, the easier it is to investigate and verify the issue.

  - type: checkboxes
    id: tags
    attributes:
      label: Tags
      description: Select all categories that apply to this report.
      options:
        - label: "Art/Visual"
        - label: "Encounter"
        - label: "Items"
        - label: "NPCs"
        - label: "Other"
        - label: "PvP"
        - label: "Quest"
        - label: "Spells and Talents"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 1. Current Behavior

  - type: textarea
    id: current_behavior_description
    attributes:
      label: "1.1 Description"
      description: "Describe how the mechanic, spell, NPC, item, quest, etc. is currently working."
      placeholder: |
        Describe the current behaviour in as much detail as possible.
    validations:
      required: true

  - type: textarea
    id: expected_behavior_description
    attributes:
      label: "2.1 Description"
      description: "Describe how the mechanic, spell, NPC, item, quest, etc. should be working."
      placeholder: |
        Describe the expected behaviour in as much detail as possible.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "1.2 How to Reproduce"
      description: "Describe all the steps required to reproduce the issue. Include as many steps as necessary."
      placeholder: |
        1. Do this
        2. Do that
        3. Do this again
        4. ...
      render: text
    validations:
      required: true

  - type: textarea
    id: current_behavior_sources
    attributes:
      label: "1.3 Source Material"
      description: "Provide any videos, screenshots, forum posts, logs, links, or other material supporting the current behaviour."
      placeholder: |
        Paste links or provide other relevant source material here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 2. Expected Behavior

